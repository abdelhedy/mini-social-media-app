spring.application.name=mini-social-media-app

# Load local secrets from .env (see .env.example)
spring.config.import=optional:file:.env[.properties]

# MongoDB connection details
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:postify}
spring.data.mongodb.repositories.enabled=true
file.upload.dir=E:/postify_files

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Connection and socket timeout settings (optional)
spring.data.mongodb.connection-timeout=10000 # 10 seconds
spring.data.mongodb.socket-timeout=10000 # 10 seconds